<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Time Out Cafe Hoogeveen</title>
<meta name="description" content="Contact en route naar Time Out Cafe in Hoogeveen: adres, telefoon, e-mail en openingstijden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Source+Sans+3:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body data-pagina="contact" data-footer-contact="uit" data-footer-volg="uit">
<main>
  <section class="hero laag">
    <img src="images/hero.jpg" onerror="this.onerror=null;this.src='images/hero-placeholder.svg'" alt="Sfeerbeeld van het café" width="1600" height="900">
    <div class="wrap">
      <h1>Contact</h1>
      <p class="slogan">Kom langs, bel of stuur ons een berichtje.</p>
    </div>
  </section>

  <section class="sectie">
    <div class="wrap">
      <div class="info-raster drie">
        <div class="kaart">
          <h3>Adres &amp; contact</h3>
          <p data-site="adres">Grotekerkstraat 17<br>Hoogeveen</p>
          <p style="margin-top:.8rem">Telefoon: <a class="tekstlink" data-site="telefoonHref" href="#"><span data-site="telefoon"></span></a><br>
          E-mail: <a class="tekstlink" data-site="emailHref" href="#"><span data-site="email"></span></a></p>
          <div class="social social-rij" style="margin-top:1rem">
            <a class="fb" data-site="facebookHref" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff" aria-hidden="true"><path d="M14 8h3V4h-3c-2.8 0-5 2.2-5 5v2H6v4h3v7h4v-7h3l1-4h-4V9c0-.6.4-1 1-1z"/></svg>Facebook</a>
            <a class="ig" data-site="instagramHref" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg>Instagram</a>
          </div>
        </div>
        <div class="kaart">
          <h3>Openingstijden</h3>
          <table class="tijden" data-site="tijden"></table>
          <p class="opmerking">Openingstijden volgen binnenkort.</p>
        </div>
        <div class="kaart-embed">
          <iframe data-site="mapsEmbed" title="Kaart met de locatie van Time Out Cafe" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
          <a class="kaart-link" data-site="routeHref" href="#" target="_blank" rel="noopener" aria-label="Route naar Time Out Cafe plannen in Google Maps"><span>Route plannen</span></a>
        </div>
      </div>

    </div>
  </section>
</main>
</body>
</html>

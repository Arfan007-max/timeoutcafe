<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Time Out Cafe Hoogeveen</title>
<meta name="description" content="Contact en route naar Time Out Cafe in Hoogeveen: adres, telefoon, e-mail en openingstijden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Source+Sans+3:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body data-pagina="contact">
<main>
  <section class="pagina-kop">
    <div class="wrap">
      <h1>Contact</h1>
      <p>Kom langs, bel of stuur ons een berichtje.</p>
    </div>
  </section>

  <section class="sectie">
    <div class="wrap">
      <div class="info-raster">
        <div class="kaart">
          <h3>Adres &amp; contact</h3>
          <p data-site="adres">Grotekerkstraat 17<br>Hoogeveen</p>
          <p style="margin-top:.8rem">Telefoon: <a class="tekstlink" data-site="telefoonHref" href="#"><span data-site="telefoon"></span></a><br>
          E-mail: <a class="tekstlink" data-site="emailHref" href="#"><span data-site="email"></span></a></p>
          <p style="margin-top:1rem" class="social-rij"><a class="knop omlijnd" data-site="facebookHref" href="#" target="_blank" rel="noopener">Facebook</a>
          <a class="knop omlijnd" data-site="instagramHref" href="#" target="_blank" rel="noopener">Instagram</a></p>
        </div>
        <div class="kaart">
          <h3>Openingstijden</h3>
          <table class="tijden" data-site="tijden"></table>
          <p class="opmerking">Openingstijden volgen binnenkort.</p>
        </div>
      </div>

      <div class="kaart-embed">
        <iframe data-site="mapsEmbed" title="Kaart met de locatie van Time Out Cafe" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
      <p class="midden" style="margin-top:1rem"><a class="knop" data-site="maps" href="#" target="_blank" rel="noopener">Route in Google Maps</a></p>
    </div>
  </section>
</main>
</body>
</html>

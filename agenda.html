<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda – Time Out Cafe Hoogeveen</title>
<meta name="description" content="De agenda van Time Out Cafe in Hoogeveen: live muziek, darten, voetbal kijken en thema-avonden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Source+Sans+3:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="events.js" defer></script>
<script src="site.js" defer></script>
</head>
<body data-pagina="agenda">
<main>
  <section class="hero laag">
    <img src="images/hero.jpg" onerror="this.onerror=null;this.src='images/hero-placeholder.svg'" alt="Sfeerbeeld van het café" width="1600" height="900">
    <div class="wrap">
      <h1>Agenda</h1>
      <p class="slogan">Wat staat er de komende tijd op het programma?</p>
    </div>
  </section>

  <section class="sectie">
    <div class="wrap">
      <ul class="agenda-lijst" id="agenda-lijst" aria-live="polite"></ul>
      <p class="leeg" id="agenda-leeg" hidden>Er staan op dit moment geen activiteiten gepland. Kijk snel weer terug!</p>
      <noscript><p class="leeg">Zet JavaScript aan om de agenda te zien.</p></noscript>
    </div>
  </section>
</main>
</body>
</html>

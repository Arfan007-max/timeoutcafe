  main { max-width: 660px; }
  .top { letter-spacing: .4em; text-transform: uppercase; font-size: .75rem; color: var(--glow); }
  h1 { font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1.05; margin-bottom: 6px; text-shadow: 0 3px 18px rgba(0,0,0,.7); }

  .fb { background: #1877F2; }

    font-size: clamp(1.8rem, 8vw, 3.8rem); font-weight: 400; font-style: italic; color: #fff3d6; letter-spacing: .03em;
    text-shadow: 0 0 6px #fff, 0 0 20px var(--glow), 0 0 44px #ff9d2e;
    box-shadow: 0 0 14px var(--glow), inset 0 0 14px rgba(243,201,120,.6), 0 0 60px rgba(243,201,120,.35); background: rgba(29,16,9,.55);
    animation: flick 5s infinite; }
  @keyframes flick { 0%,92%,96%,100% { opacity: 1 } 94% { opacity: .55 } 98% { opacity: .8 } }
